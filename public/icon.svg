<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer 3D Orbital Rings -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Ellipse Ring 1 -->
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(-30)" opacity="0.85" />
    
    <!-- Ellipse Ring 2 -->
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(30)" opacity="0.85" />

    <!-- Isometric Central 3D Cube / Science Core -->
    <!-- Top Face -->
    <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#38bdf8" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-60,-35 0,0 0,70 -60,35" fill="#1d4ed8" opacity="0.9" />
    <!-- Right Face -->
    <polygon points="0,0 60,-35 60,35 0,70" fill="#6366f1" opacity="0.95" />

    <!-- Orbital Particles -->
    <circle cx="140" cy="-45" r="9" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-130" cy="50" r="8" fill="#a855f7" filter="url(#glow)" />
    <circle cx="-50" cy="-90" r="6" fill="#67e8f9" />
    <circle cx="70" cy="85" r="7" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="#f8fafc" text-anchor="middle">VIZLAB</text>
</svg>
